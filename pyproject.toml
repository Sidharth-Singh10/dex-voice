[project]
name = "dex-voice"
version = "0.1.0"
description = "Windows-targeted Parakeet Unified to Phonon latency feasibility harness"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "huggingface-hub==2.4.0",
    "kaldi-native-fbank==1.23.0",
    "numpy==2.5.4",
    "onnxruntime-gpu[cuda,cudnn]==1.31.1",
    "ptts==0.6.0",
    "soundfile==0.14.0",
]

[project.optional-dependencies]
export = ["onnx==1.23.2"]
desktop = ["sounddevice==0.5.6"]

[dependency-groups]
dev = [
    "pytest==9.2.0", "ruff==0.17.4",
    "onnx==1.23.2",
]
windows-build = ["pyinstaller==6.22.3", "pyinstaller-hooks-contrib==2026.9"]

[project.scripts]
dex-voice = "dex_voice.cli:main"
dex-voice-desktop = "dex_voice.desktop:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/fixtures", "/packaging", "/README.md", "/RESULTS.md", "/WINDOWS.md",
    "/pyproject.toml", "/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
