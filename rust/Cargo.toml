[workspace]
resolver = "3"
members = [
    "crates/dex-asr",
    "crates/dex-tts",
    "crates/dex-audio",
    "crates/dex-core",
    "apps/dex-voice",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"
