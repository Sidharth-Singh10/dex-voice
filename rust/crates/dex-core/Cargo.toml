[package]
name = "dex-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dex-audio = { path = "../dex-audio" }
hound = "3.5"
ptts = { version = "0.6", features = ["hf"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
transcribe-cpp = { version = "=0.4.1", features = ["vulkan"] }

[lints]
workspace = true
